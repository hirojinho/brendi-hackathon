<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline';" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Study Assistant Overlay</title>
    <style>
      body { margin: 0; background: #111418; color: #e6e6e6; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
      .container { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
      .title { font-weight: 600; color: #b0b8c1; }
      .cta { background: #2b90ff; border: none; color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
      .cta:hover { background: #1f75d6; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="title">Study Assistant</div>
      <button class="cta" id="open-main">Open Full App</button>
    </div>
    <script>
      const openBtn = document.getElementById('open-main');
      openBtn?.addEventListener('click', async () => {
        try { await window.api.openMainWindow({ initialTab: 'notes', fromOverlay: true }); } catch {}
      });
    </script>
  </body>
  <script>
    // Type declaration shim for preload API
    // window.api: { openMainWindow: () => Promise<boolean> }
  </script>
</html>
